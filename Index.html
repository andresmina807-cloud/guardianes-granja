<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guardianes de la Granja Colombiana · Producción Pecuaria 10.º</title>
<style>
/* ===== COLORES (el docente puede cambiarlos aquí) ===== */
:root{--ink:#2B2A26;--soft:#5E5B52;--bg:#FBF6E6;--card:#fff;--line:#E4DAB8;--c:#1F6F66;--cbg:#E4F1EE;--ok:#2E7D32;--bad:#B3261E}
*{box-sizing:border-box}body{margin:0;font:17px/1.55 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:.2em 0 .4em}
header{position:sticky;top:0;z-index:5;background:#2B2A26;color:#FBF6E6;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header b{font-family:Georgia,serif;font-size:1.05rem}#stat{font-size:.9rem}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.btn,.opt{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--c);padding:10px 16px;background:var(--c);color:#fff;font-weight:700}
.btn.sec,.opt{background:#fff;color:var(--ink)}.btn:disabled{opacity:.45;cursor:not-allowed}
.opt{display:block;width:100%;text-align:left;margin:8px 0;font-weight:500;border-color:var(--line)}
.opt.ok{background:#E3F3E4;border-color:var(--ok)}.opt.bad{background:#FBE5E3;border-color:var(--bad);text-decoration:line-through}
:focus-visible{outline:3px solid #1A5FD0;outline-offset:2px}
input,textarea,select{font:inherit;width:100%;padding:9px;border:2px solid #9A957F;border-radius:10px;background:#fff;color:var(--ink)}
label{display:block;font-weight:700;margin:10px 0 4px}fieldset{border:2px solid var(--line);border-radius:14px;margin:14px 0;padding:12px}legend{font-weight:700;padding:0 6px}
.fb{margin-top:8px;font-weight:600}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.mod{border-top:8px solid var(--c);background:var(--cbg);border-radius:16px;padding:16px;text-align:left}
.mod .ic{font-size:2rem}.tag{display:inline-block;background:var(--c);color:#fff;border-radius:99px;padding:2px 12px;font-size:.85rem;font-weight:700}
.vid{border:3px dashed var(--c);border-radius:14px;padding:14px;background:#fff}.vid iframe{width:100%;aspect-ratio:16/9;border:0}
details{background:#fff;border:2px solid var(--c);border-radius:14px;padding:10px 14px}summary{cursor:pointer;font-weight:700}
.row{display:grid;gap:8px;grid-template-columns:1fr 1fr;align-items:center;margin:6px 0}@media(max-width:560px){.row{grid-template-columns:1fr}}
.note{font-size:.92rem;color:var(--soft)}.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
@media print{header,.noprint{display:none}}

body{background:#8fb56b}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--bg1) center/cover no-repeat;image-rendering:pixelated}
body[data-v=mod]::before,body[data-v=final]::before{background-image:var(--bg2)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(255,248,225,.12),rgba(255,248,225,.28))}
main>h1,main>h2,main>h3,main>p{background:rgba(251,246,230,.9);padding:8px 14px;border-radius:12px}
.card{background:rgba(255,255,255,.84);backdrop-filter:blur(3px)}
fieldset{background:rgba(255,255,255,.8)}legend{background:rgba(251,246,230,.95);border-radius:8px;padding:2px 8px}
.opt{background:rgba(255,255,255,.72)}.opt:hover{background:rgba(255,255,255,.95);transform:translateX(4px)}
.btn.sec{background:rgba(255,255,255,.6)}
.mod{background:color-mix(in srgb,var(--cbg) 72%,transparent);backdrop-filter:blur(2px);transition:transform .2s}
.mod:hover{transform:translateY(-6px) rotate(-1deg)}
.vid,details{background:rgba(255,255,255,.86)}
.btn{transition:transform .15s}.btn:not(:disabled):hover{transform:scale(1.06)}.btn:not(:disabled):active{transform:scale(.95)}
/* ===== MOVIMIENTO ===== */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,64,.8)}70%{box-shadow:0 0 0 14px rgba(255,214,64,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
@keyframes flit{0%,100%{transform:translate(0,0)}25%{transform:translate(30px,-25px)}50%{transform:translate(60px,5px)}75%{transform:translate(25px,-15px)}}
@keyframes rise{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(-50%,-90px) scale(1.5)}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.mod .ic{display:inline-block;animation:bob 2.2s ease-in-out infinite}.mod:nth-child(2) .ic{animation-delay:.4s}.mod:nth-child(3) .ic{animation-delay:.8s}.mod:nth-child(4) .ic{animation-delay:1.2s}
main>.btn:not(:disabled),p>.btn:not(:disabled):first-child{animation:pulse 2s infinite}
.opt.ok{animation:pop .4s}.opt.bad{animation:shake .35s}
#stat.bump{animation:pop .5s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#fx span{position:absolute;font-size:2rem;will-change:transform}
.pop{position:fixed;z-index:20;font:800 1.8rem Georgia,serif;color:#FFD23F;text-shadow:2px 2px 0 #2B2A26,-1px -1px 0 #2B2A26;pointer-events:none;animation:rise 1.2s forwards}
.conf{position:fixed;top:-30px;z-index:20;pointer-events:none;animation:fall 2.4s linear forwards}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:#2B2A26;color:#FFD23F;padding:12px 20px;border-radius:14px;font-weight:700;border:3px solid #FFD23F;animation:pop .4s}
@media(prefers-reduced-motion:reduce){*,#fx span{animation:none!important}#fx{display:none}}
